repos:
  - repo: local
    hooks:
      - id: rust-format
        name: Rust formatting
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
      - id: rust-clippy
        name: Rust Clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: rust-tests
        name: Native Rust behavioral tests
        entry: cargo test --locked --all-features
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: publication-privacy
        name: Refuse credentials private paths and unmigrated source
        entry: cargo run --locked --bin ci -- privacy
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: publication-history
        name: Scan reachable history before publication
        entry: cargo run --locked --bin ci -- privacy-history
        language: system
        pass_filenames: false
        stages: [pre-push]
