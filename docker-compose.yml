services:
  telegram-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-mcp
    env_file:
      - .env
    command: ["serve", "--http", "0.0.0.0:8765"]
    environment:
      # A non-loopback container bind requires an explicit authentication token.
      TELEGRAM_HTTP_TOKEN: ${TELEGRAM_HTTP_TOKEN:?Set a private token of at least 32 characters in .env}
      XDG_STATE_HOME: /data/state
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - telegram-state:/data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  telegram-state:
