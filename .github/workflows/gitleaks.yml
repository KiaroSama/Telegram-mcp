name: Gitleaks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '10 4 * * 4'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  status_begin:
    name: CI status pending
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-status.yml
    permissions:
      contents: read
      actions: read
      statuses: write
    with:
      phase: begin
      workflow: gitleaks.yml
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Protect checkout diagnostics
        run: test "${RUNNER_DEBUG:-0}" != 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the checksum-pinned scanner with private diagnostics
        run: cargo run --locked --bin ci -- gitleaks
  status_finish:
    name: CI status final
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [status_begin, gitleaks]
    uses: ./.github/workflows/ci-status.yml
    permissions:
      contents: read
      actions: read
      statuses: write
    with:
      phase: finish
      workflow: gitleaks.yml
