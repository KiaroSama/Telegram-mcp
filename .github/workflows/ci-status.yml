name: Commit status reporting

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      workflow:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  publish:
    name: Commit status publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATED_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the status reporter without a GitHub write token
        run: cargo build --locked --bin ci
      - name: Publish only the observed exact-commit evidence
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_PHASE: ${{ inputs.phase }}
          STATUS_WORKFLOW: ${{ inputs.workflow }}
        run: ./target/debug/ci status "$STATUS_PHASE" "$STATUS_WORKFLOW"
