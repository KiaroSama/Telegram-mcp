name: Commit status reporting

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      workflow:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  publish:
    name: Commit status publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Publish only observed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_PHASE: ${{ inputs.phase }}
          STATUS_WORKFLOW: ${{ inputs.workflow }}
        run: python scripts/ci_status.py "$STATUS_PHASE" "$STATUS_WORKFLOW"
