name: Locked Rust reproduction bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build offline Rust reproduction bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Refuse private source or history before exporting Git objects
        run: |
          cargo run --locked --bin ci -- privacy
          cargo run --locked --bin ci -- privacy-history
          cargo run --locked --bin ci -- gitleaks
      - name: Archive explicit source and locked Rust dependencies
        run: |
          set -euo pipefail
          mkdir -p reproduction
          git rev-parse HEAD > reproduction/commit.txt
          rustc --version --verbose > reproduction/rustc.txt
          cargo --version > reproduction/cargo.txt
          sha256sum Cargo.lock > reproduction/lock.sha256
          git archive --format=tar.gz HEAD > reproduction/source.tar.gz
          git bundle create reproduction/source.bundle HEAD
          git bundle verify reproduction/source.bundle
          git clone --quiet reproduction/source.bundle reproduction/replayed
          git -C reproduction/replayed fsck --full
          cd reproduction/replayed
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          CARGO_HOME="$RUNNER_TEMP/empty-cargo-cache" cargo build --offline --locked --bin telegram-mcp
          cd ../..
          rm -rf reproduction/replayed/target reproduction/replayed/.git
          tar -C reproduction -czf reproduction/locked-source-and-vendor.tar.gz replayed
          rm -rf reproduction/replayed
          sha256sum reproduction/*.txt reproduction/*.sha256 reproduction/*.tar.gz reproduction/*.bundle > reproduction/manifest.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locked-rust-linux-reproduction
          path: reproduction/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
