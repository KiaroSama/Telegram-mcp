# The second half of the guard. The pre-push hook only protects a machine that
# has it installed; this protects the repository itself, including a push from a
# fork, a web edit, or a contributor who never ran `pre-commit install`.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Refuse a credential or a private path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        # Full history, because the question is not only what the tip carries.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Scan the tracked tree
        run: python scripts/secret_scan.py

      - name: Scan every blob in history
        # A tip that is clean says nothing about a commit three months back, and a
        # public repository publishes both. The scanner lives in a script with its
        # own tests because the inline version ignored both git return codes: on an
        # unreadable directory it scanned zero blobs and announced a clean history.
        # Exit 2 means the scan could not be completed; 1 means it found something.
        run: python scripts/history_secret_scan.py
