name: Docker build and persistence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  status_begin:
    name: CI status pending
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-status.yml
    permissions:
      contents: read
      actions: read
      statuses: write
    with:
      phase: begin
      workflow: docker-build.yml
  docker_build:
    name: Build native Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATED_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker build --tag telegram-mcp:ci .
      - name: The image runs its compiled binary without credentials
        run: docker run --rm telegram-mcp:ci --version
      - name: Store the exact tested image for persistence checks
        run: docker save telegram-mcp:ci --output telegram-mcp-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-container-image
          path: telegram-mcp-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  docker_persistence:
    name: State survives container replacement
    needs: docker_build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-container-image
      - run: docker load --input telegram-mcp-image.tar
      - name: The compiled service resolves state under the persistent mount
        run: |
          set -euo pipefail
          resolved=$(docker run --rm telegram-mcp:ci state-path)
          case "$resolved" in /data/*) ;; *) exit 1 ;; esac
      - name: One non-root container writes private fixture state
        run: |
          set -euo pipefail
          docker volume create telegram-mcp-ci-state
          docker run --rm --volume telegram-mcp-ci-state:/data --entrypoint sh telegram-mcp:ci -c '
            set -eu
            test "$(id -u)" != 0
            test "$(stat -c %a /data/state/telegram-mcp)" = 700
            printf "%s\n" "synthetic-persistence-fixture" > /data/state/telegram-mcp/fixture.txt
          '
      - name: A replacement container reads exactly the same bytes
        run: |
          set -euo pipefail
          docker run --rm --volume telegram-mcp-ci-state:/data --entrypoint sh telegram-mcp:ci -c '
            set -eu
            test "$(cat /data/state/telegram-mcp/fixture.txt)" = synthetic-persistence-fixture
            test "$(stat -c %a /data/state/telegram-mcp)" = 700
          '
      - name: Remove the isolated fixture volume
        if: always()
        run: docker volume rm --force telegram-mcp-ci-state
  docker_compose:
    name: Validate authenticated Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATED_SHA }}
          persist-credentials: false
      - name: Validate with explicit synthetic configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
  status_finish:
    name: CI status final
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [status_begin, docker_build, docker_persistence, docker_compose]
    uses: ./.github/workflows/ci-status.yml
    permissions:
      contents: read
      actions: read
      statuses: write
    with:
      phase: finish
      workflow: docker-build.yml
