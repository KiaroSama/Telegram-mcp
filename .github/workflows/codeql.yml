name: CodeQL

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 4'

permissions:
  contents: read

env:
  VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  status_begin:
    name: CI status pending
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-status.yml
    permissions:
      contents: read
      actions: read
      statuses: write
    with:
      phase: begin
      workflow: codeql.yml
  analyze:
    name: Analyse Rust and Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATED_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      # Official current CodeQL docs support Rust with build-mode none.
      # rust-analyzer still runs build scripts and macros; this is not a build gate.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: rust,actions
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:rust-actions
          output: codeql-results
          upload: always
      - name: Retain the actual CodeQL SARIF reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-results/*.sarif
          if-no-files-found: error
  status_finish:
    name: CI status final
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [status_begin, analyze]
    uses: ./.github/workflows/ci-status.yml
    permissions:
      contents: read
      actions: read
      statuses: write
    with:
      phase: finish
      workflow: codeql.yml
